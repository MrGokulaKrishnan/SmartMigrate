[package]
name = "migroute"
version = "0.1.0"
rust-version = "1.75"
edition = "2021"
description = "Typed authorization and routing primitives for the Smart Migrate engine"
license = "UNLICENSED"

[lib]
name = "migroute"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

