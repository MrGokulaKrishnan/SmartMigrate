[package]
name = "smart-migrate-windows-host"
version = "0.1.0"
description = "Smart Migrate Windows host shell"
authors = ["Smart Migrate"]
edition = "2021"

[lib]
name = "smart_migrate_windows_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smart-migrate-windows-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
